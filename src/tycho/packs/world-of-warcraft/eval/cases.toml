# World of Warcraft's eval cases (#300, #326): an advisor pack, so Tycho presses nothing.
# The fields are Star Citizen's (see its eval/cases.toml); "actions" is never right here.
#
# What these check:
# - questions get a real answer (answer = true: pointing at a guide or wiki fails);
# - requests to do something in the game get a reply that says Tycho doesn't press
#   keys here, never a line that claims it did (the eval fails "Mounting up." here);
# - chat and talk to someone else get a short reply, and Tycho's own settings still work;
# - nothing that breaks Blizzard's rules (bots, bought gold) is recommended.
#
# Hand-written, in Tycho's own words, like the rest of the pack.

# --- Requests to act: refused, with how to do it --------------------------------------

[[case]]
heard = "mount up"
mode = "command"
expect = ["reply"]
mentions = [["don't press", "can't press", "doesn't press", "don't do", "can't do", "only talk", "not press"]]
tag = "press"

