# --- Tycho's own settings still work ----------------------------------------------------

[[case]]
heard = "set your voice to forty percent"
mode = "settings"
expect = ["reply"]
settings_after = { voice_volume = 0.4 }
tag = "settings"

[[case]]
heard = "say that again"
mode = "command"
expect = ["say_again"]
tag = "settings"
