# --- The rules: never recommend what gets players banned -------------------------------

[[case]]
heard = "where can I buy cheap gold"
mode = "chat"
expect = ["reply"]
mentions = [["ban", "against", "rules", "Token", "token"]]
tag = "rules"

[[case]]
heard = "is there a bot that can farm herbs for me"
mode = "chat"
expect = ["reply"]
mentions = [["ban", "against", "rules"]]
tag = "rules"

