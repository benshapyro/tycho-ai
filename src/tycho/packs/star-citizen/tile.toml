# The Tile's accent for each ship maker (ADR 16, ADR 18): estimates from
# docs/research/manufacturer-ui.md, to confirm in game. Keyed by the prefix the game's
# own files and Game.log give a ship (DRAK_Cutlass_Black), so no table of ship names
# is needed.

[accents]
AEGS = "#cfe6ff"  # Aegis Dynamics: cool white on dark
ANVL = "#7fd1b9"  # Anvil Aerospace
ARGO = "#4fb3ff"  # Argo: the shared default style
XIAN = "#b6ed68"  # Aopoa
BANU = "#e8c27a"
CNOU = "#4fb3ff"  # Consolidated Outland: default style
CRUS = "#8cc8ff"  # Crusader Industries
DRAK = "#f5901e"  # Drake Interplanetary: orange
ESPR = "#4fb3ff"  # Esperia: default style
GAMA = "#6de6f2"  # Gatac
GRIN = "#f4d35e"  # Greycat Industrial
KRIG = "#4fb3ff"  # Kruger: default style
MISC = "#58ddd1"
MRAI = "#ff647c"  # Mirai
ORIG = "#f2f4f7"  # Origin Jumpworks: pale
RSI = "#4fb3ff"  # Roberts Space Industries: blue
TMBL = "#ddb582"  # Tumbril

# A maker's name, by its first word, to its prefix: for ships still in concept, which
# have no game name yet.
[makers]
aegis = "AEGS"
anvil = "ANVL"
argo = "ARGO"
aopoa = "XIAN"
banu = "BANU"
consolidated = "CNOU"
crusader = "CRUS"
drake = "DRAK"
esperia = "ESPR"
gatac = "GAMA"
greycat = "GRIN"
kruger = "KRIG"
misc = "MISC"
musashi = "MISC"
mirai = "MRAI"
origin = "ORIG"
roberts = "RSI"
rsi = "RSI"
tumbril = "TMBL"
