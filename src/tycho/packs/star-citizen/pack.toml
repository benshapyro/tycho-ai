# Star Citizen, Tycho's first game pack (ADR 18). A pack is data: Tycho validates it on
# load and never runs anything from it. Code a pack needs is built into Tycho and named
# here by id ([parts]).

id = "star-citizen"
name = "Star Citizen"
version = "1.0.0"          # the pack's own version, shown by tycho check and in traces
format = 1                 # the folder format; Tycho refuses a format it doesn't know
mode = "keys"              # Tycho may press keys, through the safety gate
window = "StarCitizen.exe" # the program whose window must be in front to press
# What asks Tycho to look at the game window, anywhere in what's said (ADR 14, #31). Only
# with look_at_screen on; the picture goes to the brain with the question, and is never kept.
look = [
    "take a look",
    "have a look",
    "look at this",
    "look at that",
    "look at my screen",
    "look at the screen",
    "what am i looking at",
    "what is on my screen",
    "what is on the screen",
]

[parts]                     # built-in code, by id
install = "star-citizen"    # find the game folder and its channels
keybinds = "star-citizen"   # Data.p4k defaults plus actionmaps.xml
game_state = "star-citizen" # Game.log
lookups = ["ships", "fleet", "items", "mining", "trade", "settings", "web"]

# What setup says about Star Citizen (#364): the game's words live here, not in the page.
[setup]
intro = "Tycho presses your own Star Citizen keybinds when you ask, tells you what it did, and answers questions about ships, trade, mining and the game."
lookups = [
    "Ships, from the current patch's game files and the Star Citizen Wiki",
    "Trade prices and routes, where to refine an ore and where to buy a ship, live from UEX",
    "Where to mine a resource, weapons, armor, components and crafting, from the Star Citizen Wiki",
    "Your own fleet, kept on your PC",
    "News, upcoming patches, and where things are, from RSI's sites and the web",
]
sends = [
    "Ship lists are downloaded from the Star Citizen Wiki API and UEX Corp on first run and after each patch. Nothing about you is sent.",
    "A trade question sends the commodity or trading place you named to UEX Corp.",
    "A question about a weapon, armor, a component or crafting sends the item's name to the Star Citizen Wiki API.",
]
# The first two are built-in commands: they work at once, with no key.
examples = ["gear down", "lights on", "how much cargo does the Caterpillar hold?"]
tips = ["Play in Borderless Window mode so the Tile can show over the game."]
folder = "The RSI Launcher shows it under Settings, Games, Library Folder."

[web]
# The sites web search asks first (2026-11-02): RSI's own (patch notes, roadmap,
# Comm-Links, Spectrum, support), the community wiki and the community tools. The open
# web alone brought fan sites and leaked dates; it's only the fallback when these have
# no clear answer (web_search_open, ADR 15).
sites = [
    "robertsspaceindustries.com",
    "starcitizen.tools",
    "uexcorp.space",
    "erkul.games",
    "sc-craft.tools",
    "scmdb.net",
]

[briefing]
# Action maps of actions nobody asks a co-pilot for (#59).
unbriefed_actionmaps = [
    "view_director_mode",            # camera director moves
    "spectator",
    "player_emotes",
    "player_input_optical_tracking", # head tracking, VR, VOIP
    "prone",
]
# Steering and movement held down for as long as it should last: one press means nothing.
continuous = '''v_(pitch|yaw|roll)_\w+|v_strafe_(up|down|left|right|forward|back)|v_move_\w+|eva_(strafe|roll)_\w+|zgt_roll_\w+|move(forward|back|left|right)|lean(left|right)'''
