# Star Citizen, Tycho's first game pack (ADR 18). A pack is data: Tycho validates it on
# load and never runs anything from it. Code a pack needs is built into Tycho and named
# here by id ([parts]).

id = "star-citizen"
name = "Star Citizen"
version = "1.0.0"          # the pack's own version, shown by tycho check and in traces
format = 1                 # the folder format; Tycho refuses a format it doesn't know
mode = "keys"              # Tycho may press keys, through the safety gate
window = "StarCitizen.exe" # the program whose window must be in front to press
# What asks Tycho to look at the game window, anywhere in what's said (ADR 14, #31). Only
# with look_at_screen on; the picture goes to the brain with the question, and is never kept.
look = [
    "take a look",
    "have a look",
    "look at this",
    "look at that",
    "look at my screen",
    "look at the screen",
    "what am i looking at",
    "what is on my screen",
    "what is on the screen",
]

[parts]                     # built-in code, by id
install = "star-citizen"    # find the game folder and its channels
keybinds = "star-citizen"   # Data.p4k defaults plus actionmaps.xml
game_state = "star-citizen" # Game.log
lookups = ["ships", "fleet", "items", "mining", "trade", "settings", "web"]

# What setup says about Star Citizen (#364): the game's words live here, not in the page.
[setup]
intro = "Tycho presses your own Star Citizen keybinds when you ask, tells you what it did, and answers questions about ships, trade, mining and the game."
lookups = [
    "Ships, from the current patch's game files and the Star Citizen Wiki",
    "Trade prices and routes, where to refine an ore and where to buy a ship, live from UEX",
    "Where to mine a resource, weapons, armor, components, crafting and which missions give blueprints, from the Star Citizen Wiki",
    "Your own fleet, kept on your PC",
    "News, upcoming patches, and where things are, from RSI's sites and the web",
]
sends = [
    "Ship lists are downloaded from the Star Citizen Wiki API and UEX Corp on first run and after each patch. Nothing about you is sent.",
    "A trade question sends the commodity or trading place you named to UEX Corp.",
    "A question about a weapon, armor, a component or crafting sends the item's name to the Star Citizen Wiki API.",
]
# The first two are built-in commands: they work at once, with no key.
examples = ["gear down", "lights on", "how much cargo does the Caterpillar hold?"]
tips = ["Play in Borderless Window mode so the Tile can show over the game."]
folder = "The RSI Launcher shows it under Settings, Games, Library Folder."

[web]
# The sites web search asks first (2026-11-02): RSI's own (patch notes, roadmap,
# Comm-Links, Spectrum, support), the community wiki and the community tools. The open
# web alone brought fan sites and leaked dates; it's only the fallback when these have
# no clear answer (web_search_open, ADR 15).
sites = [
    "robertsspaceindustries.com",
    "starcitizen.tools",
    "uexcorp.space",
    "erkul.games",
    "sc-craft.tools",
    "scmdb.net",
]

[briefing]
# Action maps of actions nobody asks a co-pilot for (#59).
unbriefed_actionmaps = [
    "view_director_mode",            # camera director moves
    "spectator",
    "player_emotes",
    "player_input_optical_tracking", # head tracking, VR, VOIP
    "prone",
]
# Steering and movement held down for as long as it should last: one press means nothing.
continuous = '''v_(pitch|yaw|roll)_\w+|v_strafe_(up|down|left|right|forward|back)|v_move_\w+|eva_(strafe|roll)_\w+|zgt_roll_\w+|move(forward|back|left|right)|lean(left|right)'''

# Speaking up (#4, ADR 14's amendment of 22 Nov 2026): what Tycho may say without being
# asked, each kind only if the player turns it on. Each follows things Game.log records
# (the kinds in games/star_citizen/loglines.py), with a short fixed line; {name} is the
# one short name the log gave, cleaned. Blueprints (#598) are the only mission news the
# log has shown so far (23 Nov 2026).
[callouts.quantum]
name = "Quantum jump ended"
lines = { arrived = "Quantum jump complete." }

[callouts.monitored_space]
name = "Monitored space"
lines = { monitored = "In monitored space.", left_monitored = "Out of monitored space." }
example = "Out of monitored space."

[callouts.jurisdiction]
name = "Jurisdiction changes"
lines = { jurisdiction = "Now in {name} jurisdiction." }
example = "Now in UEE jurisdiction."

[callouts.armistice]
name = "Armistice zones"
lines = { armistice = "Entering an armistice zone. No combat here." }

[callouts.blueprints]
name = "Blueprints received"
lines = { blueprint = "New blueprint: {name}.", blueprint_unnamed = "New blueprint received." }
example = "New blueprint: Monde Helmet Hiro."

[callouts.private_property]
name = "Private property"
lines = { private_property = "Entering private property.", left_private_property = "Leaving private property." }

# Plotting a route by voice (#588, ADR 3's amendments of 23 and 24 Nov 2026): "plot a
# route to Levski". The flow is runtime/route.py's: nav mode, open the star map, click its
# search box, type the place, Enter, click the panel's close button, clear any route, plot,
# and check Game.log's route line. Place names come from UEX's list (the places part),
# and the map's own search result must show the name before anything more is clicked.
# The map's words and the close button's place were read on the PC at 2560x1440 (24 Nov).
[route]
say = [
    "plot a route to",
    "plot route to",
    "plot a course to",
    "plot a course for",
    "plot course to",
    "set a route to",
    "set route to",
    "set a course to",
    "set a course for",
    "set course to",
    "set course for",
    "route me to",
    "navigate to",
]
places = "star-citizen"
nav = "v_master_mode_set_nav"        # weapons offline: a click that misses can't fire
open_map = "v_starmap"
enter = "ui_textfield_enter"
clear = "mapui_action_clearroute"
plot = "mapui_action_planroute"
close_map = "v_starmap"
search_box = "search locations"      # "SEARCH LOCATIONS..." while the box is empty
results = "results"                  # "RESULTS (1)" over the list
no_results = "no results"
recent = "recent"                    # "RECENT" under the box once it has the keys
calculating = "calculatin"           # "CALCULATING..." on the panel: R waits (#682)
other_system = "another system"      # "TARGET IS IN ANOTHER SYSTEM": R can't plot (#682)
read_width = 0.5                     # the map check reads the left half: the search panel
close_marks = ["x", "×"]
close_offset = [0.307, 0.0]          # the close button, from the box's words, by frame height
close_reach = 0.02
route_set = "quantum_route_set"      # game state's fact: a route is already set
route_line = "route"                 # "Successfully calculated route to <id>"
seated = "no_route_on_map"           # "No Route loaded!": only from a pilot's seat
tool = """Plot a quantum route on the star map to a named place (a city, station, outpost, \
moon or planet) when the player asks for a route, course or quantum jump to it in words \
Tycho missed, or misheard ("plotta route to Lewski" or "Lipsky" is Levski, "take us to Crusader"). \
Give the place as the game spells it. Tycho plots it after your reply and says how it \
went in place of your reply, so reply "On it." only: never say a route is set."""
# Said after a place (#661): "here" is cut off and the place plotted; "away" can't be
# plotted, as the map only searches the system the player is in.
here = ["in this system", "in the current system", "in my system", "in this star system"]
away = [
    "in the next system",
    "in next system",
    "in another system",
    "in a different system",
    "in the other system",
    "in other system",
    "in another star system",
]

[route.lines]
done = "Route set to {name}."
replacing = "Replacing your route to {name}."
replacing_unnamed = "Replacing your old route."
on_foot = "Sit in your pilot's seat first, then ask again."
no_map = "I couldn't open the star map."
no_results = "The map can't find {name}. It only searches the system you're in."
not_listed = "The map didn't list {name}, so I left it open for you."
stuck = "I couldn't finish on the map, so I left it open for you."
no_route = "I couldn't plot a route to {name}. Your quantum fuel may be low."
other_place = "The map plotted a route, but I can't tell it's to {name}. Check the map."
bad_name = "I can't type {name} into the map."
no_key = "A key the star map needs isn't bound, so I didn't open it."
unknown_place = "I don't know a place called {name}."
no_places = "I can't get the list of places right now, so I didn't plot a route."
trying = "I only plot routes in the game, not while you try things here."
elsewhere = "The map only plots routes in the system you're in. Jump there first, then ask."
other_system = "The map picked a {name} in another system, so I left it open for you."
