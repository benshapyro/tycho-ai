<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tycho</title>
<style>/*CSS*/</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="glyph" viewBox="0 0 24 24"><path d="M12 1.5 13.6 10.4 22.5 12 13.6 13.6 12 22.5 10.4 13.6 1.5 12 10.4 10.4Z" fill="currentColor"/><circle cx="12" cy="12" r="6.2" fill="none" stroke="currentColor" stroke-width="1.1" opacity=".7"/></symbol>
</svg>
<header>
  <span class="brand"><svg><use href="#glyph"/></svg>Tycho</span>
  <nav aria-label="Sections">
    <button type="button" data-view="status">Status <span class="badge" id="statusBadge"></span></button>
    <button type="button" data-view="settings">Settings</button>
    <button type="button" data-view="commands">Commands <span class="badge" id="noKeyBadge"></span></button>
  </nav>
  <span class="grow"></span>
  <span class="ver num" id="ver"></span>
</header>
<main id="page"><p class="loading">Loading…</p></main>
<div class="toast frame" id="toast" role="status" hidden><span id="toastText"></span><button type="button" id="toastUndo" hidden>Undo</button></div>
<script>/*JS*/</script>
</body>
</html>
