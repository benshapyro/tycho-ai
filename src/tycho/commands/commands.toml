# Spoken shortcuts: the fast path, handled on the player's PC without the language model.
#
# Each command lists ways players say it, and the game actions that do it, best
# first. Put a specific action ("Open All Doors") before a toggle: the toggle
# is the fallback when the specific one has no key bound, and pressing a toggle
# without knowing the current state can do the opposite of what was asked.
#
# confirm = true means Tycho asks before acting (see docs/architecture.md, 4.7).
# Anything not matched here goes to the language model, so this list only
# needs the commands people say most and want instantly.

# Landing gear
[[command]]
id = "landing_gear"
say = ["landing gear", "gear", "toggle landing gear", "toggle the gear", "toggle the landing gear"]
actions = ["v_toggle_landing_system"]

[[command]]
id = "landing_gear_down"
say = ["lower the landing gear", "lower landing gear", "lower the gear", "gear down", "landing gear down", "deploy landing gear", "deploy the landing gear", "deploy the gear", "drop the gear", "drop the landing gear"]
actions = ["v_deploy_landing_system", "v_toggle_landing_system"]

[[command]]
id = "landing_gear_up"
say = ["raise the landing gear", "raise landing gear", "raise the gear", "gear up", "landing gear up", "retract landing gear", "retract the landing gear", "retract the gear"]
actions = ["v_retract_landing_system", "v_toggle_landing_system"]

[[command]]
id = "request_landing"
say = ["request landing", "request landing permission", "request a landing pad", "ask for a landing pad", "call the tower", "contact the tower", "request docking"]
actions = ["v_atc_request"]

