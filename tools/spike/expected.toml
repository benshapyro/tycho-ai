# What should happen for each phrase in phrases.txt, written before the matcher was run.
# Each value lists acceptable outcomes: a command id from src/tycho/commands/commands.toml,
# several joined with "+" for a chain, or "brain" for "hand it to the language model".

"landing gear" = ["landing_gear"]
"lower the landing gear" = ["landing_gear_down"]
"open the doors" = ["doors_open"]
"close all doors" = ["doors_close"]
"lights on" = ["lights_on"]
"request landing" = ["request_landing"]
"power on" = ["power_on"]
"flight ready" = ["flight_ready"]
"engines on" = ["engines_on"]
"spool the quantum drive" = ["quantum_mode"]
"shields to front" = ["shields_front"]
"max power to weapons" = ["max_power_weapons"]
"balance power" = ["balance_power"]
"pips to engines" = ["power_to_engines"]
"target the nearest hostile" = ["target_nearest_hostile"]
"deploy countermeasures" = ["decoys"]
"launch a decoy" = ["decoys"]
"exit seat" = ["exit_seat"]
"open mobiglas" = ["mobiglas"]
"get us ready to leave and call the tower" = ["brain"]
"we're done here, power everything down" = ["brain", "power_off"]
"okay drop the gear and ask for a landing pad" = ["landing_gear_down+request_landing", "brain"]
"do that again" = ["brain"]
"no, the other one" = ["brain"]
"QT to ArcCorp" = ["brain"]
"set a route to microTech" = ["brain"]
"where's the best place to sell quantanium right now" = ["brain"]
"what's the nearest refinery" = ["brain"]
"how long is the quantum jump to Hurston" = ["brain"]
"is my Cutlass loadout any good" = ["brain"]
