# Keyboard bindings for specific on/off actions, so Tycho never has to guess with a toggle (#13).
# Checked against the author's layout on 2026-10-30: every key is unused in every context.
# Other players: run make_layout.py, which refuses any key their own layout already uses.

[[add]]
action = "v_lights_on"
key = "rctrl+l"
[[add]]
action = "v_lights_off"
key = "rctrl+k"

[[add]]
action = "v_open_all_doors"
key = "rctrl+i"
[[add]]
action = "v_close_all_doors"
key = "rctrl+u"
[[add]]
action = "v_lock_all_doors"
key = "rctrl+j"
[[add]]
action = "v_unlock_all_doors"
key = "rctrl+h"

[[add]]
action = "v_deploy_landing_system"
key = "rctrl+n"
[[add]]
action = "v_retract_landing_system"
key = "rctrl+m"

[[add]]
action = "v_power_set_on"
key = "rctrl+1"
[[add]]
action = "v_power_set_off"
key = "rctrl+2"
[[add]]
action = "v_power_set_thrusters_on"
key = "rctrl+3"
[[add]]
action = "v_power_set_thrusters_off"
key = "rctrl+4"
[[add]]
action = "v_power_set_shields_on"
key = "rctrl+5"
[[add]]
action = "v_power_set_shields_off"
key = "rctrl+6"
[[add]]
action = "v_power_set_weapons_on"
key = "rctrl+7"
[[add]]
action = "v_power_set_weapons_off"
key = "rctrl+8"

[[add]]
action = "v_shield_raise_level_forward"
key = "ralt+1"
[[add]]
action = "v_shield_raise_level_back"
key = "ralt+2"
[[add]]
action = "v_shield_raise_level_left"
key = "ralt+3"
[[add]]
action = "v_shield_raise_level_right"
key = "ralt+4"
[[add]]
action = "v_shield_reset_level"
key = "ralt+5"

[[add]]
action = "v_set_quantum_mode"
key = "rctrl+q"
[[add]]
action = "v_set_flight_mode"
key = "rctrl+f"

[[add]]
action = "v_weapon_gimbals_state_set_locked"
key = "rctrl+g"
[[add]]
action = "v_weapon_gimbals_state_set_unlocked"
key = "rctrl+v"

# Master modes: specific keys next to B (the game's master-mode key), so "nav mode"
# never cycles you back to SCM.
[[add]]
action = "v_master_mode_set_nav"
key = "ralt+b"
[[add]]
action = "v_master_mode_set_scm"
key = "ralt+v"
