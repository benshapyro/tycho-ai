# Keyboard bindings for specific on/off actions, so Tycho never has to guess with a toggle (#13).
# Checked against the author's layout on 2026-10-30: every key is unused in every context.
# Other players: run make_layout.py, which refuses any key their own layout already uses.

[[add]]
action = "v_lights_on"
key = "rctrl+l"
[[add]]
action = "v_lights_off"
key = "rctrl+k"

[[add]]
action = "v_open_all_doors"
key = "rctrl+i"
[[add]]
action = "v_close_all_doors"
key = "rctrl+u"
[[add]]
action = "v_lock_all_doors"
key = "rctrl+j"
[[add]]
action = "v_unlock_all_doors"
key = "rctrl+h"

[[add]]
action = "v_deploy_landing_system"
key = "rctrl+n"
[[add]]
action = "v_retract_landing_system"
key = "rctrl+m"

[[add]]
action = "v_power_set_on"
key = "rctrl+1"
[[add]]
action = "v_power_set_off"
key = "rctrl+2"
[[add]]
action = "v_power_set_thrusters_on"
key = "rctrl+3"
[[add]]
action = "v_power_set_thrusters_off"
key = "rctrl+4"
[[add]]
action = "v_power_set_shields_on"
key = "rctrl+5"
[[add]]
action = "v_power_set_shields_off"
key = "rctrl+6"
[[add]]
action = "v_power_set_weapons_on"
key = "rctrl+7"
[[add]]
action = "v_power_set_weapons_off"
key = "rctrl+8"

[[add]]
action = "v_shield_raise_level_forward"
key = "ralt+1"
[[add]]
action = "v_shield_raise_level_back"
key = "ralt+2"
[[add]]
action = "v_shield_raise_level_left"
key = "ralt+3"
[[add]]
action = "v_shield_raise_level_right"
key = "ralt+4"
[[add]]
action = "v_shield_reset_level"
key = "ralt+5"

[[add]]
action = "v_set_quantum_mode"
key = "rctrl+q"
[[add]]
action = "v_set_flight_mode"
key = "rctrl+f"

[[add]]
action = "v_weapon_gimbals_state_set_locked"
key = "rctrl+g"
[[add]]
action = "v_weapon_gimbals_state_set_unlocked"
key = "rctrl+v"

# Master modes: specific keys next to B (the game's master-mode key), so "nav mode"
# never cycles you back to SCM.
[[add]]
action = "v_master_mode_set_nav"
key = "ralt+b"
[[add]]
action = "v_master_mode_set_scm"
key = "ralt+v"

# Quantum engage: on its own key, because left mouse also fires and requests a jump-point jump.
[[add]]
action = "v_toggle_qdrive_engagement"
key = "ralt+q"

# Flight assists: specific on/off keys instead of toggles.
[[add]]
action = "v_ifcs_throttle_set_sticky"
key = "rctrl+c"
[[add]]
action = "v_ifcs_throttle_set_normal"
key = "rctrl+z"
[[add]]
action = "v_ifcs_vector_decoupling_on"
key = "rctrl+d"
[[add]]
action = "v_ifcs_vector_decoupling_off"
key = "rctrl+e"
[[add]]
action = "v_vtol_on"
key = "ralt+t"
[[add]]
action = "v_vtol_off"
key = "ralt+u"
[[add]]
action = "v_ifcs_gravity_compensation_on"
key = "rctrl+w"
[[add]]
action = "v_ifcs_gravity_compensation_off"
key = "ralt+e"
[[add]]
action = "v_ifcs_proximity_assist_on"
key = "ralt+8"
[[add]]
action = "v_ifcs_proximity_assist_off"
key = "ralt+9"

# Night vision.
[[add]]
action = "v_light_amplification_on"
key = "ralt+o"
[[add]]
action = "v_light_amplification_off"
key = "ralt+p"

# Operator modes (flight and quantum are above).
[[add]]
action = "v_set_mining_mode"
key = "ralt+m"
[[add]]
action = "v_set_salvage_mode"
key = "rctrl+s"
[[add]]
action = "v_set_scan_mode"
key = "rctrl+r"
[[add]]
action = "v_set_missile_mode"
key = "ralt+j"
[[add]]
action = "v_set_guns_mode"
key = "ralt+f"

# Shields to top and bottom (front, back, left and right are above).
[[add]]
action = "v_shield_raise_level_up"
key = "ralt+6"
[[add]]
action = "v_shield_raise_level_down"
key = "ralt+7"
