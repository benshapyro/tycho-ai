[[case]]
heard = "hide the tile"
expect = ["reply"]
settings_after = { tile = false }
tag = "settings"


# Play session (#156): a command and a fleet change in one breath. The act ended the
# request, so the Pitbull was never noted. Fails until #156 is fixed.
[[case]]
heard = "can you turn off power I'm in my uh Drake Pitbull right now"
expect = ["actions"]
must = [["v_power_set_off", "v_power_toggle"]]
never = ["v_power_set_on"]
flying_after = "Pitbull"
tag = "fleet"

# Refining and buying ships with aUEC (#152), from UEX.
[[case]]
heard = "where should I refine my quantanium"
expect = ["reply"]
mentions = [['UEX']]
tools = ["refining"]
max_calls = 2
no_errors = true
tag = "trade"

[[case]]
heard = "where can I buy a prospector in game"
expect = ["reply"]
mentions = [['UEX'], ['\d']]
tools = ["ship_purchases"]
max_calls = 2
no_errors = true
tag = "trade"

# Mining (#151): where a resource is, from the game files.
[[case]]
heard = "where are the best places to get lindinium"
expect = ["reply"]
mentions = [['Nyx', 'Glaciem', 'Keeger']]
tools = ["mining_lookup"]
max_calls = 2
no_errors = true
tag = "mining"

[[case]]
heard = "where can I mine quantanium in stanton"
expect = ["reply"]
tools = ["mining_lookup"]
max_calls = 2
no_errors = true
tag = "mining"

# "Say that again" (#222): the session replays the last answer word for word. It must
# never reach the brain, which would cost a call and could word it differently.
[[case]]
heard = "say that again"
expect = ["say_again"]
max_calls = 0
tag = "say_again"

[[case]]
heard = "come again?"
expect = ["say_again"]
max_calls = 0
tag = "say_again"
