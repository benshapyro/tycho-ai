# --- Chains -----------------------------------------------------------------

[[case]]
heard = "power up, lights on, and request landing"
expect = ["actions"]
must = [["v_power_toggle", "v_power_set_on", "v_flightready"], ["v_lights", "v_lights_on"], ["v_atc_request"]]
tag = "chain"

[[case]]
heard = "lower the gear and turn on the lights"
expect = ["actions"]
must = [["v_toggle_landing_system", "v_deploy_landing_system"], ["v_lights", "v_lights_on"]]
tag = "chain"

[[case]]
heard = "decoys and noise now"
expect = ["actions"]
must = [["v_weapon_countermeasure_decoy_launch"], ["v_weapon_countermeasure_noise_launch"]]
tag = "chain"

[[case]]
heard = "max shields and target the nearest hostile"
expect = ["actions"]
must = [["v_engineering_assignment_shields_max", "v_engineering_assignment_shields_increase"], ["v_target_cycle_hostile_reset"]]
tag = "chain"

[[case]]
heard = "close the doors, flight ready, then call ATC"
expect = ["actions"]
must = [["v_toggle_all_doors", "v_close_all_doors"], ["v_flightready"], ["v_atc_request"]]
tag = "chain"

[[case]]
heard = "we're landing, gear down and request a pad"
expect = ["actions"]
must = [["v_toggle_landing_system", "v_deploy_landing_system"], ["v_atc_request"]]
tag = "chain"

[[case]]
heard = "weapons hot and lock the gimbals"
expect = ["actions"]
must = [["v_power_toggle_weapons", "v_power_set_weapons_on"], ["v_weapon_gimbals_state_toggle", "v_weapon_gimbals_state_set_locked"]]
tag = "chain"

[[case]]
heard = "throttle to zero and spacebrake"
expect = ["actions"]
must = [["v_power_throttle_min"], ["v_space_brake", "v_brake"]]
tag = "chain"

[[case]]
heard = "after you power on, close the doors"
expect = ["actions"]
must = [["v_power_toggle", "v_power_set_on", "v_flightready"], ["v_toggle_all_doors", "v_close_all_doors"]]
tag = "chain"

