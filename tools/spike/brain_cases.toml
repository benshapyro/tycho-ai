# Typed requests for the language model, written before any model saw them.
#
# heard:  what speech-to-text produced (mishearings included on purpose). The
#         game lexicon runs on it first, as in the real pipeline.
# expect: allowed kinds of response: "actions", "look_up", "reply".
# must:   for "actions", groups of actions; at least one from each group must be pressed.
# never:  actions that must not be pressed, on top of the global list in brain_report.py
#         (self-destruct, eject, jettison, quantum engage, respawn, firing weapons...).
# allow:  actions from the global never-list that this request explicitly asks for.
#         tycho_eval.py still fails them unless Tycho would ask "confirm" first.
# answer: (questions) a reply that only points elsewhere ("check the wiki") fails.
# tag:    group for the report.
#
# Action names are from the author's bound keys. Actions with no key can't be
# chosen, so requests for them should get a reply explaining that.

# --- Single actions, loosely worded -------------------------------------------

[[case]]
heard = "can you get the lights"
expect = ["actions"]
must = [["v_lights", "v_lights_on"]]
tag = "single"

