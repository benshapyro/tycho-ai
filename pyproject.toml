[project]
name = "tycho-ai"
version = "0.0.0"
description = "An unofficial voice co-pilot for Star Citizen."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.14"
classifiers = [
    "Development Status :: 1 - Planning",
    "Environment :: Win32 (MS Windows)",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3.14",
    "Topic :: Games/Entertainment",
]
dependencies = [
    "keyring>=25.7.0",
    "numpy>=2.5.4",
    "onnx-asr==0.12.0",
    "onnxruntime-gpu==1.31.1",
    "pydantic>=2.14.2",
    "pygame-ce>=2.5.8",
    "sounddevice>=0.5.6",
]

[project.scripts]
tycho = "tycho.app:main"

[dependency-groups]
dev = [
    "pre-commit>=4",
    "pyright>=1.1.414",
    "pytest>=8",
    "ruff>=0.17",
]
# Only the measurement tools in tools/ use these; the app doesn't depend on them yet.
bench = [
    "anthropic>=2.3.0",
    "httpx2>=2.16.0",
    "openai>=3.41.0",
    "soundfile>=0.14.0",
]
# CUDA and cuDNN as pip wheels (~2 GB), so speech recognition can use the graphics card
# without a system CUDA install. Without them ONNX Runtime runs on the CPU. CI leaves them out.
gpu = [
    "onnxruntime-gpu[cuda,cudnn]==1.31.1",
]

[tool.uv]
default-groups = ["dev", "bench", "gpu"]
environments = ["sys_platform == 'win32' and platform_machine == 'AMD64'"]  # Windows only (ADR 1)

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "tycho"  # the distribution is tycho-ai; the import package is tycho

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "PT", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.pyright]
include = ["src", "tests", "tools"]
extraPaths = ["src", "tools/bench"]  # bench scripts import each other
# Engine scripts run in their own environments (PEP 723), so their imports aren't installed here.
exclude = ["tools/bench/engines", "tools/bench/tts/kokoro_tts.py"]
typeCheckingMode = "strict"
pythonVersion = "3.14"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config", "-m", "not replay"]
markers = ["replay: real recordings through the real speech model; run with -m replay"]
